<div class="main-select-container">
    <label [for]="idSelect()">{{ inputLabel() }} : </label>
    <select
        [id]="idSelect()"
        (change)="handleSelectionChange($event)"
    >
        @if (!includeAllOption()) {
            <option value="" disabled selected hidden>Sélectionner une option</option>
        }
        @for (option of finalOptions(); track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
        }
    </select>
</div>
